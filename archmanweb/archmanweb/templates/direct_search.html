    <input type="text" inputmode="search" placeholder="جستجوی دستور یا بسته (مثلاً ls, pacman)..." name="q" value="{% block current_search_term %}{% endblock %}"
        {% if search_autofocus %}autofocus{% endif %} />

</form>
