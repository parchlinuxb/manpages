{% extends "base.html" %}

{% block title %}خطای سرور — صفحات راهنمای پارچ لینوکس{% endblock %}

{% block content %}
<article id="content-left" class="search-page-article" dir="rtl">
    <div class="box" style="text-align: center; padding: 3rem 1.5rem; margin-top: 1rem;">
        <h1 style="border-bottom: none; font-size: 2.2rem; margin-bottom: 0.75rem;">۵۰۰ — خطای داخلی سرور</h1>
        <p style="font-size: 1.05rem; color: var(--parch-text-muted); max-width: 500px; margin: 0 auto 2rem auto; line-height: 1.8;">
            متأسفانه در پردازش درخواست شما خطایی رخ داده است. لطفاً لحظاتی بعد مجدداً تلاش کنید یا به صفحه اصلی بازگردید.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'index' %}" class="btn-primary parch-btn" style="text-decoration: none; padding: 0.65rem 1.6rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                <span>بازگشت به صفحه اصلی</span>
            </a>
            <a href="{% url 'search' %}" class="btn-secondary parch-btn-secondary" style="text-decoration: none; padding: 0.65rem 1.6rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                <span>جستجوی مستندات</span>
            </a>
        </div>
    </div>
</article>
{% endblock %}
