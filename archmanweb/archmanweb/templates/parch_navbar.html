{% load static %}

<div id="parchnavbar">
    <div class="nav-container">
        <div id="logo">
            <a href="{% url 'index' %}" title="خانه">
                <img src="{% static 'archmanweb/parch.svg' %}" alt="Parch Linux" class="parch-logo-img" />
                <span class="parch-brand-text">Parch <span class="accent-text">Manuals</span></span>
            </a>
        </div>
        <div class="nav-controls">
            <div class="theme-switcher" role="group" aria-label="انتخاب پوسته">
                <button type="button" class="theme-btn" data-theme-val="light" title="پوسته روشن" aria-label="Light theme">
                    <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
                <button type="button" class="theme-btn" data-theme-val="system" title="پوسته خودکار / هماهنگ با سیستم" aria-label="System theme">
                    <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
                </button>
                <button type="button" class="theme-btn" data-theme-val="dark" title="پوسته تاریک" aria-label="Dark theme">
                    <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
            </div>
            <button id="nav-toggle" aria-label="منوی سایت" aria-expanded="false" class="nav-toggle-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div id="parchnavbarmenu" class="nav-menu">
            <ul id="parchnavbarlist">
                <li id="pnb-home"><a href="{% url 'index' %}" title="خانه">صفحه اصلی</a></li>
                <li id="pnb-search"><a href="{% url 'search' %}" title="جستجوی من‌پیج‌ها">جستجو</a></li>
                <li id="pnb-listing"><a href="{% url 'listing' %}" title="فهرست بسته‌ها">بسته‌ها</a></li>
                <li id="pnb-website"><a href="https://parchlinux.com" target="_blank" title="وب‌سایت رسمی پارچ">وب‌سایت</a></li>
                <li id="pnb-wiki"><a href="https://wiki.parchlinux.com" target="_blank" title="ویکی پارچ">ویکی</a></li>
                <li id="pnb-github"><a href="https://github.com/parchlinux" target="_blank" title="گیت‌هاب پارچ">گیت‌هاب</a></li>
                <li id="pnb-download"><a href="https://parchlinux.com/download" target="_blank" class="download-badge" title="دریافت پارچ لینوکس">دانلود پارچ</a></li>
            </ul>
        </div>
    </div>
</div>
<script>
(function() {
    var navToggle = document.getElementById('nav-toggle');
    var navMenu = document.getElementById('parchnavbarmenu');
    if (navToggle && navMenu) {
        navToggle.addEventListener('click', function() {
            var active = navMenu.classList.toggle('is-active');
            this.setAttribute('aria-expanded', active ? 'true' : 'false');
        });
    }

    var themeBtns = document.querySelectorAll('.theme-btn');
    var stored = localStorage.getItem('parch_theme') || 'system';

    function updateThemeUI(theme) {
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'system');
        }
        themeBtns.forEach(function(b) {
            if (b.getAttribute('data-theme-val') === theme) {
                b.classList.add('is-active');
            } else {
                b.classList.remove('is-active');
            }
        });
    }

    updateThemeUI(stored);

    themeBtns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var chosen = this.getAttribute('data-theme-val');
            localStorage.setItem('parch_theme', chosen);
            updateThemeUI(chosen);
        });
    });
})();
</script>
