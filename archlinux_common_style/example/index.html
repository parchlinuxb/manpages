<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Arch Linux Navigation Bar</title>
		<link rel="stylesheet" href="../css/navbar.css" type="text/css" media="screen" title="no title" charset="utf-8">
	</head>
	<body>
	</body>

	<script>
		document.addEventListener('DOMContentLoaded', (event) => {
			fetch("/html/navbar.html")
			.then(response => {
				return response.text()
			})
			.then(data => {
				document.querySelector("body").innerHTML = data;
			});
		});
	</script>
</html>
